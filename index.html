<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>信男藥局｜手機盤點</title>
  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}
    .wrap{max-width:640px;margin:auto;padding:16px 14px 70px}
    .badge{display:inline-block;background:#ccfbf1;color:#0f766e;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:700}
    h1{font-size:24px;margin:10px 0 16px}
    .card{background:#fff;border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
    label{display:block;font-weight:800;margin-bottom:8px}
    input{width:100%;height:50px;border:1px solid #d6dee9;border-radius:12px;padding:0 14px;font-size:18px}
    button{width:100%;min-height:52px;border:0;border-radius:13px;margin-top:10px;font-size:17px;font-weight:800}
    .primary{background:#0f766e;color:#fff}.secondary{background:#e2e8f0;color:#172033}.blue{background:#2563eb;color:#fff}.danger{background:#fee2e2;color:#b91c1c}
    #videoWrap{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;background:#111827;display:none}
    video{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
    .scanBox{position:absolute;left:8%;right:8%;top:36%;height:28%;border:3px solid #22c55e;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.18);pointer-events:none}
    .scanLine{position:absolute;left:12%;right:12%;top:50%;height:2px;background:#22c55e;box-shadow:0 0 10px #22c55e;pointer-events:none}
    .status{font-size:14px;line-height:1.6;color:#64748b;margin-top:9px}.ok{color:#059669;font-weight:800}.bad{color:#dc2626;font-weight:800}
    .product{display:none;border-left:5px solid #0f766e}
    .name{font-size:21px;font-weight:900}.price{font-size:16px;color:#475569;margin-top:5px}.code{font-size:14px;color:#64748b;margin-top:5px}
    .qtyRow{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center;margin-top:12px}
    .qtyRow button{margin:0;font-size:24px;min-height:50px}.qtyRow input{text-align:center;font-size:24px;font-weight:900}
    .actionGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f8fafc;border-radius:13px;padding:12px;text-align:center}.metric b{font-size:26px;display:block}
    .list{margin-top:10px}.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #eef2f7}.item:first-child{border-top:0}.itemName{font-weight:700}.itemQty{font-weight:900;color:#2563eb;white-space:nowrap}
    .hint{background:#eff6ff;color:#1e40af;border-radius:12px;padding:12px;font-size:14px;line-height:1.6;margin-top:12px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="badge">📷 即時掃碼＋數量輸入測試</div>
  <h1>信男藥局｜手機盤點</h1>

  <div class="card">
    <label for="employee">盤點人員</label>
    <input id="employee" placeholder="例如：婷婷" autocomplete="name">
  </div>

  <div class="card">
    <label>即時相機掃描</label>
    <button id="startBtn" class="primary">📷 開啟後鏡頭開始掃描</button>
    <button id="stopBtn" class="danger" style="display:none">停止相機</button>
    <div id="videoWrap">
      <video id="video" playsinline muted></video>
      <div class="scanBox"></div><div class="scanLine"></div>
    </div>
    <div id="cameraStatus" class="status">第一次開啟時，請允許瀏覽器使用相機。</div>
    <div class="hint">測試商品：<b>科林頓金門一條根貼布7片</b><br>條碼：<b>4715095854976</b></div>
  </div>

  <div id="productCard" class="card product">
    <div class="status">目前商品</div>
    <div id="productName" class="name"></div>
    <div id="productCode" class="code"></div>
    <div id="productPrice" class="price"></div>

    <label for="qty" style="margin-top:14px">本次盤點數量</label>
    <div class="qtyRow">
      <button id="minusBtn" class="secondary">−</button>
      <input id="qty" type="number" inputmode="numeric" min="1" value="1">
      <button id="plusBtn" class="secondary">＋</button>
    </div>

    <div class="actionGrid">
      <button id="quickBtn" class="secondary">快速＋1</button>
      <button id="confirmBtn" class="blue">確認加入</button>
    </div>
    <button id="cancelBtn" class="danger">取消這筆</button>
  </div>

  <div class="card">
    <div class="summary">
      <div class="metric"><span>本次品項</span><b id="skuCount">0</b></div>
      <div class="metric"><span>本次總數量</span><b id="totalCount">0</b></div>
    </div>
    <div id="resultList" class="list"></div>
  </div>

  <div class="card">
    <label for="manual">手動輸入條碼</label>
    <input id="manual" inputmode="numeric" placeholder="輸入條碼">
    <button id="manualBtn" class="secondary">查找商品</button>
  </div>
</div>

<script>
const PRODUCTS={
  "4715095854976":{name:"科林頓金門一條根貼布7片",vip:70}
};
const counts={};
let reader=null,controls=null,lockedCode=null,lastSuccessAt=0,currentCode=null,scanPaused=false,audioCtx=null;
const $=id=>document.getElementById(id);

function beep(){
  try{
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=1150;g.gain.value=.05;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.09);
  }catch(e){}
  if(navigator.vibrate)navigator.vibrate(70);
}
function showProduct(code){
  const p=PRODUCTS[code];
  if(!p){alert("目前測試版尚未收錄此條碼："+code);scanPaused=false;return}
  currentCode=code;scanPaused=true;
  $("productName").textContent=p.name;
  $("productCode").textContent="條碼："+code;
  $("productPrice").textContent="VIP價："+(p.vip??"—");
  $("qty").value=1;
  $("productCard").style.display="block";
  $("productCard").scrollIntoView({behavior:"smooth",block:"center"});
  beep();
}
function addCurrent(qty){
  if(!currentCode)return;
  qty=Math.floor(Number(qty)||0);if(qty<1){alert("請輸入正確數量");return}
  counts[currentCode]=(counts[currentCode]||0)+qty;
  render();
  finishProduct();
}
function finishProduct(){
  currentCode=null;scanPaused=false;$("productCard").style.display="none";lockedCode=null;
  if($("videoWrap").style.display!=="none"){
    $("cameraStatus").className="status ok";
    $("cameraStatus").textContent="✅ 可以繼續掃下一個商品";
  }
}
function render(){
  const entries=Object.entries(counts).filter(([,q])=>q>0);
  $("skuCount").textContent=entries.length;
  $("totalCount").textContent=entries.reduce((s,[,q])=>s+q,0);
  $("resultList").innerHTML=entries.slice().reverse().map(([code,q])=>{
    const p=PRODUCTS[code]||{name:"未知商品"};
    return '<div class="item"><div><div class="itemName">'+escapeHtml(p.name)+'</div><div class="code">'+escapeHtml(code)+'</div></div><div class="itemQty">× '+q+'</div></div>'
  }).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

async function startScanner(){
  if(!$("employee").value.trim()){alert("請先輸入盤點人員姓名");return}
  $("cameraStatus").className="status";$("cameraStatus").textContent="正在開啟後鏡頭……";
  try{
    if(!window.ZXingBrowser)throw new Error("掃碼程式載入失敗，請重新整理頁面");
    reader=new ZXingBrowser.BrowserMultiFormatReader();
    $("videoWrap").style.display="block";$("startBtn").style.display="none";$("stopBtn").style.display="block";
    const devices=await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
    let deviceId;
    if(devices&&devices.length){
      const back=devices.find(d=>/back|rear|environment|後|背/i.test(d.label));
      deviceId=(back||devices[devices.length-1]).deviceId;
    }
    controls=await reader.decodeFromVideoDevice(deviceId,"video",(result,error)=>{
      const now=Date.now();
      if(result&&!scanPaused){
        const code=result.getText?result.getText():String(result.text||"");
        if(!code||lockedCode===code)return;
        lockedCode=code;lastSuccessAt=now;
        $("cameraStatus").className="status ok";$("cameraStatus").textContent="✅ 掃到 "+code;
        showProduct(code);
      }else if(!result&&lockedCode&&now-lastSuccessAt>650&&!scanPaused){lockedCode=null}
    });
    $("cameraStatus").className="status ok";$("cameraStatus").textContent="✅ 相機已開啟，請將條碼放入綠色框內";
  }catch(err){
    $("cameraStatus").className="status bad";$("cameraStatus").textContent="❌ 無法開啟相機："+(err?.message||err);
    $("videoWrap").style.display="none";$("startBtn").style.display="block";$("stopBtn").style.display="none";
  }
}
function stopScanner(){
  try{if(controls)controls.stop()}catch(e){}
  controls=null;reader=null;lockedCode=null;
  $("videoWrap").style.display="none";$("startBtn").style.display="block";$("stopBtn").style.display="none";
  $("cameraStatus").className="status";$("cameraStatus").textContent="相機已停止";
}

$("startBtn").onclick=startScanner;$("stopBtn").onclick=stopScanner;
$("minusBtn").onclick=()=>{$("qty").value=Math.max(1,(Number($("qty").value)||1)-1)};
$("plusBtn").onclick=()=>{$("qty").value=(Number($("qty").value)||1)+1};
$("quickBtn").onclick=()=>addCurrent(1);
$("confirmBtn").onclick=()=>addCurrent($("qty").value);
$("cancelBtn").onclick=finishProduct;
$("manualBtn").onclick=()=>{
  if(!$("employee").value.trim()){alert("請先輸入盤點人員姓名");return}
  const code=$("manual").value.trim();if(code)showProduct(code);
};
$("manual").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("manualBtn").click()}});
window.addEventListener("pagehide",stopScanner);
</script>
</body>
</html>
