<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>信男藥局｜手機盤點</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}
    #loading{padding:32px 18px;text-align:center;color:#475569;font-weight:700}
  </style>
</head>
<body>
  <div id="loading">正在載入信男藥局盤點系統…</div>
  <script>
  (async()=>{
    try{
      const r=await fetch("./app-v12.html?v=20261011-1",{cache:"no-store"});
      if(!r.ok)throw new Error("HTTP "+r.status);
      let html=await r.text();
      html=html.replace("</body>",'<script src="./hotfix-v13.js?v=20261011-1"><\\/script></body>');
      document.open();
      document.write(html);
      document.close();
    }catch(err){
      document.getElementById("loading").innerHTML="❌ 盤點頁載入失敗，請重新整理。<br><small>"+String(err&&err.message||err)+"</small>";
    }
  })();
  </script>
</body>
</html>
