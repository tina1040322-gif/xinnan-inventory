<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>信男藥局｜手機盤點</title>
  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}
    .wrap{max-width:680px;margin:auto;padding:16px 14px 70px}
    .badge{display:inline-block;background:#ccfbf1;color:#0f766e;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:700}
    h1{font-size:24px;margin:10px 0 16px}
    .card{background:#fff;border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
    label{display:block;font-weight:800;margin-bottom:8px}
    input{width:100%;height:50px;border:1px solid #d6dee9;border-radius:12px;padding:0 14px;font-size:18px}
    button{width:100%;min-height:52px;border:0;border-radius:13px;margin-top:10px;font-size:17px;font-weight:800}
    .primary{background:#0f766e;color:#fff}.secondary{background:#e2e8f0;color:#172033}.blue{background:#2563eb;color:#fff}.danger{background:#fee2e2;color:#b91c1c}
    #videoWrap{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;background:#111827;display:none}
    video{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
    .scanBox{position:absolute;left:8%;right:8%;top:36%;height:28%;border:3px solid #22c55e;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.18);pointer-events:none}
    .scanLine{position:absolute;left:12%;right:12%;top:50%;height:2px;background:#22c55e;box-shadow:0 0 10px #22c55e;pointer-events:none}
    .status{font-size:14px;line-height:1.6;color:#64748b;margin-top:9px}.ok{color:#059669;font-weight:800}.bad{color:#dc2626;font-weight:800}
    .product{display:none;border-left:5px solid #0f766e}
    .name{font-size:21px;font-weight:900}.price{font-size:16px;color:#475569;margin-top:5px}.code{font-size:14px;color:#64748b;margin-top:5px}
    .qtyRow{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center;margin-top:12px}
    .qtyRow button{margin:0;font-size:24px;min-height:50px}.qtyRow input{text-align:center;font-size:24px;font-weight:900}
    .actionGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f8fafc;border-radius:13px;padding:12px;text-align:center}.metric b{font-size:26px;display:block}
    .list{margin-top:10px}.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #eef2f7}.item:first-child{border-top:0}.itemName{font-weight:700}.itemQty{font-weight:900;color:#2563eb;white-space:nowrap}
    .hint{background:#eff6ff;color:#1e40af;border-radius:12px;padding:12px;font-size:14px;line-height:1.6;margin-top:12px}
    .searchResults{max-height:330px;overflow:auto;margin-top:10px}
    .searchItem{border-top:1px solid #eef2f7;padding:10px 0;display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:center}
    .searchItem:first-child{border-top:0}.searchItem button{margin:0;min-height:42px;font-size:14px}
    .small{font-size:12px;color:#64748b;margin-top:3px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="badge">✅ 正式盤點模式 v4</div>
  <h1>信男藥局｜手機盤點</h1>

  <div class="card">
    <label for="employee">盤點人員</label>
    <input id="employee" placeholder="例如：婷婷" autocomplete="name">
    <div class="status">姓名會保存在這支手機。</div>
  </div>

  <div class="card">
    <label>即時相機掃描</label>
    <button id="startBtn" class="primary">📷 開啟後鏡頭開始掃描</button>
    <button id="stopBtn" class="danger" style="display:none">停止相機</button>
    <div id="videoWrap">
      <video id="video" playsinline muted></video>
      <div class="scanBox"></div><div class="scanLine"></div>
    </div>
    <div id="cameraStatus" class="status">掃描後可直接＋1，或手動輸入整批數量。</div>
  </div>

  <div id="productCard" class="card product">
    <div class="status">目前商品</div>
    <div id="productName" class="name"></div>
    <div id="productCode" class="code"></div>
    <div id="productPrice" class="price"></div>
    <div id="batchTotalHint" class="hint" style="margin-top:10px">正在取得本批累計…</div>

    <label for="qty" style="margin-top:14px">本次盤點數量</label>
    <div class="qtyRow">
      <button id="minusBtn" class="secondary">−</button>
      <input id="qty" type="number" inputmode="numeric" min="1" value="1">
      <button id="plusBtn" class="secondary">＋</button>
    </div>

    <div class="actionGrid">
      <button id="quickBtn" class="secondary">快速＋1</button>
      <button id="confirmBtn" class="blue">確認加入</button>
    </div>

    <button id="correctionBtn" class="secondary" style="margin-top:10px">✏️ 盤點更正</button>

    <div id="correctionPanel" style="display:none;margin-top:12px;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#f8fafc">
      <div style="font-weight:700;margin-bottom:6px">盤點更正</div>
      <div class="status" style="margin-bottom:10px">請輸入「差額」，不是重新輸入總數。</div>

      <div class="actionGrid">
        <button id="overBtn" class="danger" type="button">多算了 → 扣除</button>
        <button id="underBtn" class="secondary" type="button">少算了 → 補上</button>
      </div>

      <label for="correctionQty" style="margin-top:12px">更正數量</label>
      <input id="correctionQty" type="number" inputmode="numeric" min="1" value="1">

      <label for="correctionNote" style="margin-top:10px">備註（選填）</label>
      <input id="correctionNote" placeholder="例如：剛才手滑輸入50，實際應為5">

      <div id="correctionPreview" class="status" style="margin-top:10px">目前選擇：多算了，會從累計扣除。</div>

      <div class="actionGrid" style="margin-top:10px">
        <button id="confirmCorrectionBtn" class="blue" type="button">確認更正</button>
        <button id="cancelCorrectionBtn" class="secondary" type="button">取消更正</button>
      </div>
    </div>

    <button id="cancelBtn" class="danger">取消這筆</button>
  </div>

  <div class="card">
    <label for="search">沒有條碼？搜尋商品名稱</label>
    <input id="search" placeholder="至少輸入 2 個字，例如：樂伊妥">
    <div id="searchStatus" class="status">也可以搜尋有條碼的商品。</div>
    <div id="searchResults" class="searchResults"></div>
  </div>

  <div class="card">
    <div class="summary">
      <div class="metric"><span>本次品項</span><b id="skuCount">0</b></div>
      <div class="metric"><span>本次總數量</span><b id="totalCount">0</b></div>
    </div>
    <div id="resultList" class="list"></div>
    <div id="cloudStatus" class="status" style="margin-top:12px">☁️ 正式盤點：每筆確認後會寫入 Google Sheet「盤點紀錄」。</div>
  </div>

  <div class="card">
    <label for="manual">手動輸入條碼</label>
    <input id="manual" inputmode="numeric" placeholder="輸入條碼">
    <button id="manualBtn" class="secondary">查找商品</button>
  </div>
</div>

function beep(){
  try{
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=1150;g.gain.value=.05;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.09);
  }catch(e){}
  if(navigator.vibrate)navigator.vibrate(70);
}

function chooseDuplicate(list){
  if(list.length===1) return list[0];
  let msg="同一條碼找到多個商品，請輸入序號：\n\n";
  list.forEach((p,i)=>msg+=(i+1)+". "+p.name+"\n");
  const n=parseInt(prompt(msg),10);
  return list[n-1]||null;
}

function cloudFrameRequest(params={}, formFields=null){
  return new Promise((resolve,reject)=>{
    const requestId="req_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const iframe=document.createElement("iframe");
    iframe.name="xinnanFrame_"+requestId;
    iframe.style.display="none";
    document.body.appendChild(iframe);

    let form=null;
    let done=false;
    const cleanup=()=>{
      if(done)return;done=true;
      window.removeEventListener("message",onMessage);
      if(form&&form.parentNode)form.parentNode.removeChild(form);
      if(iframe.parentNode)iframe.parentNode.removeChild(iframe);
    };
    const timer=setTimeout(()=>{
      cleanup();
      reject(new Error("雲端回應逾時"));
    },15000);

    const onMessage=(event)=>{
      const data=event.data;
      if(!data||data.source!=="xinnan-inventory"||data.requestId!==requestId)return;
      clearTimeout(timer);
      cleanup();
      if(data.ok)resolve(data);
      else reject(new Error(data.error||"雲端操作失敗"));
    };
    window.addEventListener("message",onMessage);

    if(formFields){
      form=document.createElement("form");
      form.method="POST";
      form.action=CLOUD_ENDPOINT;
      form.target=iframe.name;
      form.style.display="none";
      const fields={...formFields,responseMode:"postMessage",requestId};
      for(const [k,v] of Object.entries(fields)){
        const input=document.createElement("input");
        input.type="hidden";input.name=k;input.value=String(v??"");
        form.appendChild(input);
      }
      document.body.appendChild(form);
      form.submit();
    }else{
      const q=new URLSearchParams({...params,requestId,_:String(Date.now())});
      iframe.src=CLOUD_ENDPOINT+"?"+q.toString();
    }
  });
}

function getBatchTotalFromCloud(p){
  return cloudFrameRequest({
    action:"getBatchTotalFrame",
    batch:localBatch(),
    barcode:p.barcode||"",
    productName:p.name
  }).then(data=>Number(data.batchTotal||0));
}

  currentProduct=p;currentMethod=method;currentBatchTotal=null;correctionSign=-1;scanPaused=true;
  $("correctionPanel").style.display="none";
  $("correctionQty").value=1;
  $("correctionNote").value="";
  $("correctionPreview").textContent="目前選擇：多算了，會從累計扣除。";
  $("batchTotalHint").className="hint";
  $("batchTotalHint").textContent="☁️ 正在取得這個商品的本批累計…";
  getBatchTotalFromCloud(p).then(total=>{
    if(currentProduct!==p)return;
    currentBatchTotal=Number(total||0);
    $("batchTotalHint").className="hint";
    $("batchTotalHint").innerHTML=total>0
      ? "本批目前已盤：<b style=\"font-size:22px\">"+total+"</b>"
      : "本批目前尚未盤點";
  }).catch(()=>{
    if(currentProduct!==p)return;
    $("batchTotalHint").textContent="⚠️ 暫時無法取得中央累計，但仍可先盤點。";
  });
  $("productName").textContent=p.name;
  $("productCode").textContent=p.barcode?("條碼："+p.barcode):"無條碼商品";
  $("productPrice").textContent="VIP價："+(p.vip==null?"—":p.vip);
  $("qty").value=1;
  $("productCard").style.display="block";
  $("productCard").scrollIntoView({behavior:"smooth",block:"center"});
  beep();
}
function showBarcode(code){
  const list=BARCODE_MAP.get(String(code||"").trim());
  if(!list||!list.length){
    $("cameraStatus").className="status bad";
    $("cameraStatus").textContent="⚠️ 條碼有讀到，但商品主檔找不到："+code;
    lockedCode=null;
    return;
  }
  const p=chooseDuplicate(list);
  if(p)showProductObject(p,"條碼掃描"); else {scanPaused=false;lockedCode=null;}
}
function localBatch(){
  return "INITIAL-20261006";
}

async function sendCountToCloud(p,qty,method){
  const status=$("cloudStatus");
  status.className="status";
  status.textContent="☁️ 正在寫入正式盤點："+p.name+" × "+qty+"…";
  const result=await cloudFrameRequest({},{
    employee:$("employee").value.trim(),
    barcode:p.barcode||"",
    productName:p.name,
    qty:qty,
    inputMethod:method,
    batch:localBatch(),
    recordType:"盤點",
    note:""
  });
  const total=Number(result.batchTotal||0);
  status.className="status ok";
  status.innerHTML="✅ 本次加入 <b>"+qty+"</b>｜本批累計 <b style=\"font-size:20px\">"+total+"</b><br>"+esc(p.name);
  return result;
}

let savingCount=false;
async function addCurrent(qty){
  if(!currentProduct||savingCount)return;
  qty=Math.floor(Number(qty)||0);
  if(qty<1){alert("請輸入正確數量");return}
  const p=currentProduct;
  const method=currentMethod;
  savingCount=true;
  $("quickBtn").disabled=true;
  $("confirmBtn").disabled=true;
  $("cancelBtn").disabled=true;
  try{
    await sendCountToCloud(p,qty,method);
    const k=keyOf(p);
    counts[k]=counts[k]||{product:p,qty:0};
    counts[k].qty+=qty;
    render();
    finishProduct();
  }catch(err){
    const status=$("cloudStatus");
    status.className="status bad";
    status.textContent="❌ 這筆目前無法確認寫入，畫面會保留商品，請先不要重複按。請稍後再試。";
    console.error(err);
  }finally{
    savingCount=false;
    $("quickBtn").disabled=false;
    $("confirmBtn").disabled=false;
    $("cancelBtn").disabled=false;
  }
}

async function submitCorrection(){
  if(!currentProduct||savingCount)return;

  if(currentBatchTotal===null){
    alert("中央累計還沒讀取完成，請稍等一下再更正。");
    return;
  }

  const amount=Math.floor(Number($("correctionQty").value)||0);
  if(amount<1){
    alert("請輸入正確的更正數量");
    return;
  }

  const signedQty=correctionSign*amount;
  if(correctionSign<0 && amount>currentBatchTotal){
    alert("扣除數量不能大於目前本批累計 "+currentBatchTotal);
    return;
  }

  const actionText=correctionSign<0 ? "扣除" : "補上";
  const afterTotal=currentBatchTotal+signedQty;
  if(!confirm("確認"+actionText+" "+amount+"？\n目前累計："+currentBatchTotal+"\n更正後："+afterTotal)){
    return;
  }

  const p=currentProduct;
  const note=$("correctionNote").value.trim();

  savingCount=true;
  ["quickBtn","confirmBtn","cancelBtn","correctionBtn","confirmCorrectionBtn","cancelCorrectionBtn","overBtn","underBtn"].forEach(id=>$(id).disabled=true);

  try{
    const result=await cloudFrameRequest({},{
      employee:$("employee").value.trim(),
      barcode:p.barcode||"",
      productName:p.name,
      qty:signedQty,
      inputMethod:correctionSign<0 ? "盤點更正-扣除" : "盤點更正-補上",
      batch:localBatch(),
      recordType:"盤點更正",
      note:note || (correctionSign<0 ? "多算更正" : "少算更正")
    });

    const total=Number(result.batchTotal||0);
    currentBatchTotal=total;
    const status=$("cloudStatus");
    status.className="status ok";
    status.innerHTML="✅ 更正完成：<b>"+(signedQty>0?"+":"")+signedQty+"</b>｜本批累計 <b style=\"font-size:20px\">"+total+"</b><br>"+esc(p.name);
    finishProduct();
  }catch(err){
    const status=$("cloudStatus");
    status.className="status bad";
    status.textContent="❌ 更正目前無法確認寫入，商品畫面會保留，請先不要重複按。";
    console.error(err);
  }finally{
    savingCount=false;
    ["quickBtn","confirmBtn","cancelBtn","correctionBtn","confirmCorrectionBtn","cancelCorrectionBtn","overBtn","underBtn"].forEach(id=>$(id).disabled=false);
  }
}

function finishProduct(){
  currentProduct=null;currentBatchTotal=null;scanPaused=false;$("correctionPanel").style.display="none";$("productCard").style.display="none";lockedCode=null;
  if($("videoWrap").style.display!=="none"){
    $("cameraStatus").className="status ok";
    $("cameraStatus").textContent="✅ 可以繼續掃下一個商品";
  }
}
function render(){
  const entries=Object.values(counts).filter(x=>x.qty>0);
  $("skuCount").textContent=entries.length;
  $("totalCount").textContent=entries.reduce((s,x)=>s+x.qty,0);
  $("resultList").innerHTML=entries.slice().reverse().slice(0,40).map(x=>{
    const p=x.product;
    return '<div class="item"><div><div class="itemName">'+esc(p.name)+'</div><div class="code">'+esc(p.barcode||"無條碼")+'</div></div><div class="itemQty">× '+x.qty+'</div></div>';
  }).join("");
}

async function startScanner(){
  if(!$("employee").value.trim()){alert("請先輸入盤點人員姓名");return}
  $("cameraStatus").className="status";$("cameraStatus").textContent="正在開啟後鏡頭……";
  try{
    if(!window.ZXingBrowser)throw new Error("掃碼程式載入失敗，請重新整理頁面");
    reader=new ZXingBrowser.BrowserMultiFormatReader();
    $("videoWrap").style.display="block";$("startBtn").style.display="none";$("stopBtn").style.display="block";
    const devices=await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
    let deviceId;
    if(devices&&devices.length){
      const back=devices.find(d=>/back|rear|environment|後|背/i.test(d.label));
      deviceId=(back||devices[devices.length-1]).deviceId;
    }
    controls=await reader.decodeFromVideoDevice(deviceId,"video",(result,error)=>{
      const now=Date.now();
      if(result&&!scanPaused){
        const code=result.getText?result.getText():String(result.text||"");
        if(!code||lockedCode===code)return;
        lockedCode=code;lastSuccessAt=now;
        $("cameraStatus").className="status ok";$("cameraStatus").textContent="✅ 掃到 "+code;
        showBarcode(code);
      }else if(!result&&lockedCode&&now-lastSuccessAt>650&&!scanPaused){lockedCode=null}
    });
    $("cameraStatus").className="status ok";$("cameraStatus").textContent="✅ 相機已開啟，請將條碼放入綠色框內";
  }catch(err){
    $("cameraStatus").className="status bad";$("cameraStatus").textContent="❌ 無法開啟相機："+(err&&err.message?err.message:err);
    $("videoWrap").style.display="none";$("startBtn").style.display="block";$("stopBtn").style.display="none";
  }
}
function stopScanner(){
  try{if(controls)controls.stop()}catch(e){}
  controls=null;reader=null;lockedCode=null;
  $("videoWrap").style.display="none";$("startBtn").style.display="block";$("stopBtn").style.display="none";
  $("cameraStatus").className="status";$("cameraStatus").textContent="相機已停止";
}

$("correctionBtn").onclick=()=>{
  $("correctionPanel").style.display=$("correctionPanel").style.display==="none"?"block":"none";
};
$("overBtn").onclick=()=>{
  correctionSign=-1;
  $("correctionPreview").textContent="目前選擇：多算了，會從累計扣除。";
};
$("underBtn").onclick=()=>{
  correctionSign=1;
  $("correctionPreview").textContent="目前選擇：少算了，會補進累計。";
};
$("confirmCorrectionBtn").onclick=submitCorrection;
$("cancelCorrectionBtn").onclick=()=>{$("correctionPanel").style.display="none";};

$("startBtn").onclick=startScanner;$("stopBtn").onclick=stopScanner;
$("minusBtn").onclick=()=>{$("qty").value=Math.max(1,(Number($("qty").value)||1)-1)};
$("plusBtn").onclick=()=>{$("qty").value=(Number($("qty").value)||1)+1};
$("quickBtn").onclick=()=>addCurrent(1);
$("confirmBtn").onclick=()=>addCurrent($("qty").value);
$("cancelBtn").onclick=finishProduct;

$("manualBtn").onclick=()=>{
  if(!$("employee").value.trim()){alert("請先輸入盤點人員姓名");return}
  const code=$("manual").value.trim();
  if(code)showBarcode(code);
};
$("manual").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("manualBtn").click()}});

let searchTimer=null;
$("search").addEventListener("input",()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    const q=$("search").value.trim().toLowerCase();
    const box=$("searchResults");
    box.innerHTML="";
    if(q.length<2){$("searchStatus").textContent="至少輸入 2 個字";return}
    const found=[];
    for(const p of PRODUCT_LIST){
      if(p.name.toLowerCase().includes(q)){found.push(p);if(found.length>=30)break}
    }
    $("searchStatus").textContent=found.length?("找到 "+found.length+" 筆（最多顯示 30 筆）"):"找不到商品";
    box.innerHTML=found.map((p,i)=>
      '<div class="searchItem"><div><div class="itemName">'+esc(p.name)+'</div><div class="small">'+esc(p.barcode||"無條碼")+'｜VIP '+(p.vip==null?"—":p.vip)+'</div></div><button class="secondary" data-i="'+i+'">選擇</button></div>'
    ).join("");
    box.querySelectorAll("button").forEach(btn=>{
      btn.onclick=()=>showProductObject(found[Number(btn.dataset.i)],"品名搜尋");
    });
  },180);
});

window.addEventListener("pagehide",stopScanner);
</script>
