<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>信男藥局｜亞培奶水盤點測試</title>
  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}
    .wrap{max-width:680px;margin:auto;padding:16px 14px 70px}
    .badge{display:inline-block;background:#fff7ed;color:#c2410c;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:800}
    h1{font-size:24px;margin:10px 0 8px}
    .sub{font-size:14px;color:#64748b;line-height:1.6}
    .card{background:#fff;border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
    label{display:block;font-weight:800;margin-bottom:8px}
    input{width:100%;height:50px;border:1px solid #d6dee9;border-radius:12px;padding:0 14px;font-size:18px}
    button{width:100%;min-height:52px;border:0;border-radius:13px;margin-top:10px;font-size:17px;font-weight:800}
    .primary{background:#0f766e;color:#fff}.secondary{background:#e2e8f0;color:#172033}.carton{background:#7c3aed;color:#fff}.danger{background:#fee2e2;color:#b91c1c}.blue{background:#2563eb;color:#fff}
    .notice{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;padding:12px;border-radius:12px;font-size:14px;line-height:1.6;margin-top:12px}
    #videoWrap{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;background:#111827;display:none}
    video{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
    .scanBox{position:absolute;left:8%;right:8%;top:34%;height:32%;border:3px solid #22c55e;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.18);pointer-events:none}
    .scanLine{position:absolute;left:12%;right:12%;height:3px;background:#22ff72;box-shadow:0 0 10px #22ff72;pointer-events:none;animation:scanMove 1.6s linear infinite alternate}
    @keyframes scanMove{from{top:38%}to{top:62%}}
    .status{font-size:14px;line-height:1.6;color:#64748b;margin-top:9px}.ok{color:#059669;font-weight:800}.bad{color:#dc2626;font-weight:800}
    .product{display:none;border-left:5px solid #0f766e}.name{font-size:21px;font-weight:900}.code{font-size:14px;color:#64748b;margin-top:5px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .custom{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;margin-top:8px}
    .custom button{margin:0}
    .qty{font-size:34px;font-weight:900;color:#2563eb;margin-top:8px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="badge">🧪 TEST-MILK｜不更新正式庫存</div>
  <h1>信男藥局｜亞培奶水盤點測試</h1>
  <div class="sub">使用原本可正常開啟相機的 ZXing 即時掃描方式。</div>

  <div class="notice">
    測試商品：<b>亞培安素237ml(原味)(新)</b><br>
    條碼：070074124698｜單罐＝1瓶｜整箱＝24瓶
  </div>

  <div class="card">
    <label for="employee">盤點人員</label>
    <input id="employee" placeholder="例如：婷婷" autocomplete="name">
  </div>

  <div class="card">
    <label>① 即時相機掃描</label>
    <button id="startBtn" class="primary">📷 開啟後鏡頭開始掃描</button>
    <button id="stopBtn" class="danger" style="display:none">停止相機</button>
    <div id="videoWrap">
      <video id="video" playsinline muted></video>
      <div class="scanBox"></div>
      <div class="scanLine"></div>
    </div>
    <div id="cameraStatus" class="status">按「開啟後鏡頭開始掃描」，將條碼放進綠色框。</div>
  </div>

  <div class="card">
    <label for="manual">② 手動輸入條碼</label>
    <input id="manual" inputmode="numeric" value="070074124698" placeholder="輸入條碼">
    <button id="manualBtn" class="secondary">查詢商品</button>
  </div>

  <div id="productCard" class="card product">
    <div class="status">目前商品</div>
    <div class="name">亞培安素237ml(原味)(新)</div>
    <div class="code">條碼：070074124698</div>

    <div class="grid2" style="margin-top:12px">
      <button id="singleBtn" class="blue">＋1 單罐</button>
      <button id="cartonBtn" class="carton">＋1 整箱<br><span style="font-size:13px">＝24瓶</span></button>
    </div>

    <div class="custom">
      <input id="bottleQty" type="number" inputmode="numeric" min="1" placeholder="自訂瓶數">
      <button id="bottleBtn" class="secondary">加入瓶數</button>
    </div>

    <div class="custom">
      <input id="cartonQty" type="number" inputmode="numeric" min="1" placeholder="自訂箱數">
      <button id="cartonCustomBtn" class="secondary">加入箱數</button>
    </div>
  </div>

  <div id="resultCard" class="card" style="display:none">
    <div class="status">本機本次累計</div>
    <div id="localTotal" class="qty">0 瓶</div>
    <div id="cloudStatus" class="status"></div>
  </div>
</div>

<script>
const CLOUD_ENDPOINT="https://script.google.com/macros/s/AKfycbxIkr5ficj-H6la69SfP7pDpIyJDIXYJAc_9cepsC6ty4i6HciMKx-O3rPKKd3dBtadVQ/exec";
const PRODUCT={barcode:"070074124698",name:"亞培安素237ml(原味)(新)",cartonQty:24};

let reader=null,controls=null,scanPaused=false,lastCode="",localTotal=0;

const $=id=>document.getElementById(id);
$("employee").value=localStorage.getItem("xinnan_emp")||"";
$("employee").addEventListener("change",()=>localStorage.setItem("xinnan_emp",$("employee").value.trim()));

function batchName(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return "TEST-MILK-"+y+"-"+m+"-"+day;
}

function normalizeBarcode(code){
  code=String(code||"").trim();
  if(code===PRODUCT.barcode)return code;
  if(code.length===11 && ("0"+code)===PRODUCT.barcode)return PRODUCT.barcode;
  return code;
}

function cloudFrameRequest(formFields){
  return new Promise((resolve,reject)=>{
    const requestId="req_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const iframe=document.createElement("iframe");
    iframe.name="xinnanFrame_"+requestId;
    iframe.style.display="none";
    document.body.appendChild(iframe);

    const form=document.createElement("form");
    form.method="POST";
    form.action=CLOUD_ENDPOINT;
    form.target=iframe.name;
    form.style.display="none";

    const fields={...formFields,responseMode:"postMessage",requestId};
    for(const [k,v] of Object.entries(fields)){
      const input=document.createElement("input");
      input.type="hidden";
      input.name=k;
      input.value=String(v??"");
      form.appendChild(input);
    }
    document.body.appendChild(form);

    let done=false;
    const cleanup=()=>{
      if(done)return;
      done=true;
      window.removeEventListener("message",onMessage);
      if(form.parentNode)form.parentNode.removeChild(form);
      if(iframe.parentNode)iframe.parentNode.removeChild(iframe);
    };
    const timer=setTimeout(()=>{
      cleanup();
      reject(new Error("雲端回應逾時"));
    },15000);
    const onMessage=event=>{
      const data=event.data;
      if(!data||data.source!=="xinnan-inventory"||data.requestId!==requestId)return;
      clearTimeout(timer);
      cleanup();
      if(data.ok)resolve(data);
      else reject(new Error(data.error||"雲端操作失敗"));
    };
    window.addEventListener("message",onMessage);
    form.submit();
  });
}

function showProduct(code){
  code=normalizeBarcode(code);
  if(code!==PRODUCT.barcode){
    $("cameraStatus").className="status bad";
    $("cameraStatus").textContent="目前測試頁只接受亞培原味條碼："+code;
    return;
  }
  scanPaused=true;
  $("manual").value=PRODUCT.barcode;
  $("productCard").style.display="block";
  $("productCard").scrollIntoView({behavior:"smooth",block:"center"});
  $("cameraStatus").className="status ok";
  $("cameraStatus").textContent="✅ 找到亞培原味，請選擇單罐或整箱。";
}

async function startScanner(){
  if(!$("employee").value.trim()){alert("請先輸入盤點人員姓名");return}
  $("cameraStatus").className="status";
  $("cameraStatus").textContent="正在開啟後鏡頭……";
  try{
    if(!window.ZXingBrowser)throw new Error("掃碼程式載入失敗，請重新整理頁面");
    reader=new ZXingBrowser.BrowserMultiFormatReader();
    $("videoWrap").style.display="block";
    $("startBtn").style.display="none";
    $("stopBtn").style.display="block";

    const devices=await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
    let deviceId;
    if(devices&&devices.length){
      const back=devices.find(d=>/back|rear|environment|後|背/i.test(d.label));
      deviceId=(back||devices[devices.length-1]).deviceId;
    }

    controls=await reader.decodeFromVideoDevice(deviceId,"video",(result,error)=>{
      if(!result||scanPaused)return;
      const raw=result.getText?result.getText():String(result.text||"");
      const code=normalizeBarcode(raw);
      if(!code||code===lastCode)return;
      lastCode=code;
      setTimeout(()=>lastCode="",700);

      if(code===PRODUCT.barcode){
        $("cameraStatus").className="status ok";
        $("cameraStatus").textContent="✅ 掃到 "+code;
        showProduct(code);
        stopScanner();
      }
    });

    $("cameraStatus").className="status ok";
    $("cameraStatus").textContent="✅ 相機已開啟，請將條碼放入綠色框內";
  }catch(err){
    $("cameraStatus").className="status bad";
    $("cameraStatus").textContent="❌ 無法開啟相機："+(err&&err.message?err.message:err);
    $("videoWrap").style.display="none";
    $("startBtn").style.display="block";
    $("stopBtn").style.display="none";
  }
}

function stopScanner(){
  try{if(controls)controls.stop()}catch(e){}
  controls=null;
  reader=null;
  $("videoWrap").style.display="none";
  $("startBtn").style.display="block";
  $("stopBtn").style.display="none";
}

async function saveQty(qty,label){
  if(!$("employee").value.trim()){alert("請先輸入盤點人員姓名");return}
  qty=Math.floor(Number(qty)||0);
  if(qty<1){alert("請輸入正確數量");return}

  $("resultCard").style.display="block";
  $("cloudStatus").className="status";
  $("cloudStatus").textContent="☁️ 正在寫入 TEST-MILK 測試批次……";

  try{
    const result=await cloudFrameRequest({
      employee:$("employee").value.trim(),
      barcode:PRODUCT.barcode,
      productName:PRODUCT.name,
      qty,
      inputMethod:label,
      batch:batchName(),
      recordType:"盤點",
      note:"亞培奶水單罐/整箱換算測試"
    });

    localTotal+=qty;
    $("localTotal").textContent=localTotal+" 瓶";
    $("cloudStatus").className="status ok";
    $("cloudStatus").textContent="✅ 寫入成功｜本次 "+label+"｜雲端批次累計："+Number(result.batchTotal||0)+" 瓶";
  }catch(err){
    $("cloudStatus").className="status bad";
    $("cloudStatus").textContent="❌ 寫入失敗："+(err&&err.message?err.message:err);
  }
}

$("startBtn").onclick=()=>{scanPaused=false;startScanner()};
$("stopBtn").onclick=stopScanner;
$("manualBtn").onclick=()=>showProduct($("manual").value);
$("manual").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("manualBtn").click()}});
$("singleBtn").onclick=()=>saveQty(1,"單罐 ×1");
$("cartonBtn").onclick=()=>saveQty(24,"整箱 ×1（24瓶）");
$("bottleBtn").onclick=()=>{
  const q=Number($("bottleQty").value);
  if(!Number.isInteger(q)||q<=0){alert("請輸入正確瓶數");return}
  saveQty(q,"自訂 "+q+" 瓶");
  $("bottleQty").value="";
};
$("cartonCustomBtn").onclick=()=>{
  const c=Number($("cartonQty").value);
  if(!Number.isInteger(c)||c<=0){alert("請輸入正確箱數");return}
  saveQty(c*24,"自訂 "+c+" 箱＝"+(c*24)+"瓶");
  $("cartonQty").value="";
};
window.addEventListener("pagehide",stopScanner);
</script>
</body>
</html>
